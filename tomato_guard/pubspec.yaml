name: tomato_guard
description: "Tomato Guard - Tomato Plant Disease Detection Mobile Application with LADA Enhancement"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  sqflite: ^2.3.2
  path: ^1.9.0
  intl: ^0.19.0
  camera: ^0.12.0+2
  permission_handler: ^11.3.0
  image: ^4.9.2
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/tomato_leaf.tflite
    - assets/models/classification.tflite
    - assets/models/alas_net_Severity_Segmentation_SLA_.tflite
    - assets/models/alas_net_NO_SLA.tflite
    - assets/models/labels.txt
    - assets/data/treatment_lookup.json
    - assets/data/Treatment_Lookup_Table.xlsx
