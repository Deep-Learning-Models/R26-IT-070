<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Team workflow loop: fetch, update from main, code, test, commit, push, pull request, merge, then back to fetch." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Team workflow loop</title>
<style>.t{font-family:"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:Consolas,"SFMono-Regular",Menlo,monospace}.ret{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-28}}@media (prefers-reduced-motion:reduce){.ret{animation:none}}</style>
<rect width="1280" height="360" rx="24" fill="#0E2418"/>
<text x="48" y="58" class="t" font-size="28" font-weight="800" fill="#F6F1E7">The team loop</text>
<text x="48" y="88" class="t" font-size="17" fill="#9FBFA8">Never commit to main. Work on &lt;YourName&gt;-&lt;feature&gt;, for example Maduwantha-classification-head.</text>
<line x1="110.0" y1="180" x2="1169.8" y2="180" stroke="#3E8E4F" stroke-width="4"/>
<path class="ret" d="M1203.8 180H1231.8V300H48.0V180H68.0" fill="none" stroke="#8FD19E" stroke-width="2.5"/>
<path d="M56.0 173L70.0 180L56.0 187" fill="none" stroke="#8FD19E" stroke-width="2.5"/>
<text x="639.9" y="292" text-anchor="middle" class="t" font-size="14" fill="#9FBFA8">repeat every coding session</text>
<circle cx="110.0" cy="180" r="34" fill="#15301F" stroke="#5FB86A" stroke-width="3"/><text x="110.0" y="189" text-anchor="middle" class="t" font-size="24" font-weight="800" fill="#5FB86A">1</text><text x="110.0" y="132" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#F6F1E7">Fetch</text><text x="110.0" y="240" text-anchor="middle" class="m" font-size="12" fill="#9FBFA8">origin</text>
<circle cx="261.4" cy="180" r="34" fill="#15301F" stroke="#5FB86A" stroke-width="3"/><text x="261.4" y="189" text-anchor="middle" class="t" font-size="24" font-weight="800" fill="#5FB86A">2</text><text x="261.4" y="132" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#F6F1E7">Update</text><text x="261.4" y="240" text-anchor="middle" class="m" font-size="12" fill="#9FBFA8">from main</text>
<circle cx="412.8" cy="180" r="34" fill="#15301F" stroke="#5FB86A" stroke-width="3"/><text x="412.8" y="189" text-anchor="middle" class="t" font-size="24" font-weight="800" fill="#5FB86A">3</text><text x="412.8" y="132" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#F6F1E7">Code</text><text x="412.8" y="240" text-anchor="middle" class="m" font-size="12" fill="#9FBFA8">your branch</text>
<circle cx="564.2" cy="180" r="34" fill="#15301F" stroke="#E5432F" stroke-width="3"/><text x="564.2" y="189" text-anchor="middle" class="t" font-size="24" font-weight="800" fill="#E5432F">4</text><text x="564.2" y="132" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#F6F1E7">Test</text><text x="564.2" y="240" text-anchor="middle" class="m" font-size="12" fill="#9FBFA8">pytest + doctor</text>
<circle cx="715.6" cy="180" r="34" fill="#15301F" stroke="#5FB86A" stroke-width="3"/><text x="715.6" y="189" text-anchor="middle" class="t" font-size="24" font-weight="800" fill="#5FB86A">5</text><text x="715.6" y="132" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#F6F1E7">Commit</text><text x="715.6" y="240" text-anchor="middle" class="m" font-size="12" fill="#9FBFA8">small + clear</text>
<circle cx="867.0" cy="180" r="34" fill="#15301F" stroke="#5FB86A" stroke-width="3"/><text x="867.0" y="189" text-anchor="middle" class="t" font-size="24" font-weight="800" fill="#5FB86A">6</text><text x="867.0" y="132" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#F6F1E7">Push</text><text x="867.0" y="240" text-anchor="middle" class="m" font-size="12" fill="#9FBFA8">origin</text>
<circle cx="1018.4" cy="180" r="34" fill="#15301F" stroke="#E5432F" stroke-width="3"/><text x="1018.4" y="189" text-anchor="middle" class="t" font-size="24" font-weight="800" fill="#E5432F">7</text><text x="1018.4" y="132" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#F6F1E7">Pull request</text><text x="1018.4" y="240" text-anchor="middle" class="m" font-size="12" fill="#9FBFA8">to main</text>
<circle cx="1169.8" cy="180" r="34" fill="#15301F" stroke="#5FB86A" stroke-width="3"/><text x="1169.8" y="189" text-anchor="middle" class="t" font-size="24" font-weight="800" fill="#5FB86A">8</text><text x="1169.8" y="132" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#F6F1E7">Merge</text><text x="1169.8" y="240" text-anchor="middle" class="m" font-size="12" fill="#9FBFA8">after review</text>
<circle r="7" fill="#F2A93B"><animateMotion dur="7s" repeatCount="indefinite" path="M110.0 180H1231.8V300H48.0V180Z"/></circle>
</svg>