<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="ALAS-Net pipeline: a 256 by 256 leaf photo goes through the EfficientNet-B2 backbone (1408 by 8 by 8 features), then the LADA attention module (SLA, XCA, DCG), then four task heads: disease, severity, lesion mask and treatment." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How one leaf flows through ALAS-Net</title>
  <style>
    .t{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
    .flow{stroke-dasharray:8 8;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8FD19E"/></marker>
  </defs>
  <rect width="1280" height="520" rx="24" fill="#0E2418"/>
  <text x="48" y="58" class="t" font-size="28" font-weight="800" fill="#F6F1E7">How one leaf flows through ALAS-Net</text>
  <text x="48" y="88" class="t" font-size="17" fill="#9FBFA8">The backbone reads the image once. LADA focuses it. Four heads share the result.</text>

  <g fill="none" stroke="#8FD19E" stroke-width="2.5">
    <path class="flow" d="M218 270H252" marker-end="url(#ah)"/>
    <path class="flow" d="M468 270H502" marker-end="url(#ah)"/>
    <path class="flow" d="M808 270H836V150H864" marker-end="url(#ah)"/>
    <path class="flow" d="M836 270V246H864" marker-end="url(#ah)"/>
    <path class="flow" d="M836 270V342H864" marker-end="url(#ah)"/>
    <path class="flow" d="M836 270V438H864" marker-end="url(#ah)"/>
  </g>

  <rect x="48" y="200" width="170" height="140" rx="16" fill="#163A26" stroke="#3E8E4F" stroke-width="2"/>
  <path d="M133 218C162 230 168 266 133 292C98 266 104 230 133 218Z" fill="#5FB86A"/>
  <circle cx="126" cy="250" r="6" fill="#7A4A1E"/><circle cx="142" cy="266" r="4.5" fill="#7A4A1E"/>
  <text x="133" y="316" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#F6F1E7">Leaf photo</text>
  <text x="133" y="334" text-anchor="middle" class="m" font-size="13" fill="#9FBFA8">256 × 256 × 3</text>

  <rect x="258" y="200" width="210" height="140" rx="16" fill="#163A26" stroke="#3E8E4F" stroke-width="2"/>
  <g fill="#3E8E4F"><rect x="288" y="226" width="22" height="50" rx="4"/><rect x="318" y="234" width="22" height="42" rx="4" opacity=".85"/><rect x="348" y="242" width="22" height="34" rx="4" opacity=".7"/><rect x="378" y="250" width="22" height="26" rx="4" opacity=".55"/><rect x="408" y="256" width="22" height="20" rx="4" opacity=".4"/></g>
  <text x="363" y="310" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#F6F1E7">EfficientNet-B2</text>
  <text x="363" y="330" text-anchor="middle" class="m" font-size="13" fill="#9FBFA8">1408 × 8 × 8 features</text>

  <rect x="508" y="150" width="300" height="242" rx="18" fill="#12301F" stroke="#8FD19E" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="528" y="182" class="t" font-size="18" font-weight="800" fill="#8FD19E">LADA attention</text>
  <rect x="528" y="200" width="260" height="56" rx="12" fill="#1E4A30"/>
  <text x="548" y="225" class="t" font-size="17" font-weight="700" fill="#F6F1E7">SLA</text><text x="548" y="245" class="t" font-size="13" fill="#CFE3D3">where the lesions are</text>
  <rect x="528" y="264" width="260" height="56" rx="12" fill="#1E4A30"/>
  <text x="548" y="289" class="t" font-size="17" font-weight="700" fill="#F6F1E7">XCA</text><text x="548" y="309" class="t" font-size="13" fill="#CFE3D3">which features fire together</text>
  <rect x="528" y="328" width="260" height="56" rx="12" fill="#1E4A30"/>
  <text x="548" y="353" class="t" font-size="17" font-weight="700" fill="#F6F1E7">DCG</text><text x="548" y="373" class="t" font-size="13" fill="#CFE3D3">refines features · see note</text>

  <g>
    <rect x="870" y="110" width="362" height="80" rx="16" fill="#3A1712" stroke="#E5432F" stroke-width="2.5"/>
    <circle cx="910" cy="150" r="22" fill="#E5432F"/><text x="910" y="157" text-anchor="middle" class="t" font-size="20" font-weight="800" fill="#FFF7EC">1</text>
    <text x="946" y="144" class="t" font-size="19" font-weight="700" fill="#FFF7EC">Disease</text>
    <text x="946" y="168" class="t" font-size="14" fill="#FFD9D2">10 classes + confidence %</text>
    <text x="1216" y="144" text-anchor="end" class="m" font-size="12" fill="#FF9C8A">Maduwantha</text>

    <rect x="870" y="206" width="362" height="80" rx="16" fill="#163A26" stroke="#F2A93B" stroke-width="2"/>
    <circle cx="910" cy="246" r="22" fill="#F2A93B"/><text x="910" y="253" text-anchor="middle" class="t" font-size="20" font-weight="800" fill="#2A1A02">2</text>
    <text x="946" y="240" class="t" font-size="19" font-weight="700" fill="#F6F1E7">Severity</text>
    <text x="946" y="264" class="t" font-size="14" fill="#CFE3D3">grade 0–4 · ordinal (CORAL)</text>

    <rect x="870" y="302" width="362" height="80" rx="16" fill="#163A26" stroke="#5FB86A" stroke-width="2"/>
    <circle cx="910" cy="342" r="22" fill="#5FB86A"/><text x="910" y="349" text-anchor="middle" class="t" font-size="20" font-weight="800" fill="#0E2418">3</text>
    <text x="946" y="336" class="t" font-size="19" font-weight="700" fill="#F6F1E7">Lesion mask</text>
    <text x="946" y="360" class="t" font-size="14" fill="#CFE3D3">pixel map · U-Net decoder</text>

    <rect x="870" y="398" width="362" height="80" rx="16" fill="#163A26" stroke="#6FA8FF" stroke-width="2"/>
    <circle cx="910" cy="438" r="22" fill="#6FA8FF"/><text x="910" y="445" text-anchor="middle" class="t" font-size="20" font-weight="800" fill="#0B1E3A">4</text>
    <text x="946" y="432" class="t" font-size="19" font-weight="700" fill="#F6F1E7">Treatment</text>
    <text x="946" y="456" class="t" font-size="14" fill="#CFE3D3">FAISS retrieval + confidence</text>
  </g>

  <text x="48" y="448" class="t" font-size="15" fill="#9FBFA8">Shapes follow configs/default.yaml</text>
  <text x="48" y="470" class="m" font-size="13" fill="#6F9A7C">backbone.out_channels = lada.in_channels = 1408</text>
</svg>
