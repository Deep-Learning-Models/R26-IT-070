<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-label="Bar chart of PlantVillage tomato images per class, from Yellow Leaf Curl Virus with 5,357 down to Mosaic Virus with 373, a 14 times gap." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
