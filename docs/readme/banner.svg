<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="ALAS-Net, Automated Leaf Analysis System Network. One leaf photo in; disease, severity, lesion map and treatment out." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ALAS-Net banner</title>
  <style>
    .t{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
    @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(330px)}100%{transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
    .scan{animation:scan 5s ease-in-out infinite}
    .halo{animation:pulse 2.4s ease-in-out infinite}
    .h2{animation-delay:.6s}.h3{animation-delay:1.2s}.h4{animation-delay:1.8s}
    @media (prefers-reduced-motion:reduce){.scan,.halo{animation:none}}
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/></pattern>
    <clipPath id="leafclip"><path d="M1040 34C1182 96 1214 262 1040 390C866 262 898 96 1040 34Z"/></clipPath>
  </defs>
  <rect width="1280" height="420" rx="24" fill="#0E2418"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1040" cy="210" r="250" fill="#1B4A2D" opacity=".55"/>

  <text x="70" y="88" class="m" font-size="17" letter-spacing="3" fill="#8FD19E">R26-IT-070 · SLIIT IT4010 RESEARCH PROJECT</text>
  <text x="66" y="200" class="t" font-size="104" font-weight="800" fill="#F6F1E7">ALAS<tspan fill="#E5432F">-Net</tspan></text>
  <text x="70" y="248" class="t" font-size="30" fill="#CFE3D3">Automated Leaf Analysis System Network</text>
  <text x="70" y="290" class="t" font-size="21" fill="#9FBFA8">One leaf photo in. Disease, severity, lesion map and treatment out.</text>
  <g class="m" font-size="16">
    <rect x="70" y="322" width="122" height="36" rx="18" fill="#163A26" stroke="#3E8E4F"/><text x="131" y="345" text-anchor="middle" fill="#CFE3D3">Python 3.10</text>
    <rect x="204" y="322" width="139" height="36" rx="18" fill="#163A26" stroke="#3E8E4F"/><text x="273.5" y="345" text-anchor="middle" fill="#CFE3D3">PyTorch 2.2.1</text>
    <rect x="355" y="322" width="156" height="36" rx="18" fill="#163A26" stroke="#3E8E4F"/><text x="433" y="345" text-anchor="middle" fill="#CFE3D3">EfficientNet-B2</text>
    <rect x="523" y="322" width="214" height="36" rx="18" fill="#3A1712" stroke="#E5432F"/><text x="630" y="345" text-anchor="middle" fill="#FFD9D2">PlantVillage · 18,160</text>
  </g>

  <path d="M1040 34C1182 96 1214 262 1040 390C866 262 898 96 1040 34Z" fill="#3E8E4F"/>
  <g clip-path="url(#leafclip)" stroke="#2A6638" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M1040 70Q1000 90 950 92M1040 70Q1080 90 1130 92"/>
    <path d="M1040 130Q995 150 930 156M1040 130Q1085 150 1150 156"/>
    <path d="M1040 195Q995 215 925 224M1040 195Q1085 215 1155 224"/>
    <path d="M1040 260Q1000 280 940 292M1040 260Q1080 280 1140 292"/>
    <path d="M1040 320Q1010 336 975 346M1040 320Q1070 336 1105 346"/>
  </g>
  <path d="M1040 40Q1036 210 1040 388" stroke="#235A30" stroke-width="6" fill="none"/>
  <path d="M1040 388Q1038 404 1028 414" stroke="#235A30" stroke-width="7" fill="none" stroke-linecap="round"/>
  <g>
    <circle class="halo" cx="996" cy="172" r="30" fill="#D9B84A"/>
    <circle cx="996" cy="172" r="17" fill="#7A4A1E"/>
    <circle class="halo h2" cx="1086" cy="244" r="24" fill="#D9B84A"/>
    <circle cx="1086" cy="244" r="13" fill="#7A4A1E"/>
    <circle class="halo h3" cx="1018" cy="304" r="19" fill="#D9B84A"/>
    <circle cx="1018" cy="304" r="10" fill="#7A4A1E"/>
    <circle class="halo h4" cx="1080" cy="136" r="15" fill="#D9B84A"/>
    <circle cx="1080" cy="136" r="8" fill="#7A4A1E"/>
  </g>
  <g fill="none" stroke="#E5432F" stroke-width="4" stroke-linecap="round">
    <path d="M880 56V30H906"/><path d="M1174 30H1200V56"/><path d="M880 364V390H906"/><path d="M1174 390H1200V364"/>
  </g>
  <g class="scan"><rect x="884" y="42" width="312" height="3" rx="1.5" fill="#E5432F"/><rect x="884" y="45" width="312" height="22" fill="#E5432F" opacity=".12"/></g>

  <g>
    <rect x="1098" y="282" width="166" height="98" rx="14" fill="#FFF7EC"/>
    <text x="1114" y="308" class="t" font-size="17" font-weight="700" fill="#1A1716">Early Blight</text>
    <text x="1114" y="342" class="t" font-size="30" font-weight="800" fill="#C93A26">82%</text>
    <text x="1114" y="366" class="m" font-size="11.5" fill="#5E5754">e.g. severity 2/4</text>
  </g>
</svg>
